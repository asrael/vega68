[package]
name = "vega68"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "vega68"

[lib]
doctest = false

[[bin]]
name = "vega68"
path = "src/main.rs"

[dependencies]
cpal = "0.16"
gilrs = "0.11"
m68k = "0.10"
sdl3-sys = { version = "0.6", features = ["build-from-source-static"] }

[dev-dependencies]
xtask = { path = "../xtask" }
