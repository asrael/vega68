[workspace]
resolver = "3"
members = ["crates/emu", "crates/xtask"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.dev]
opt-level = 2
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
